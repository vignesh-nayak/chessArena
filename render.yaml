services:
  - type: web
    name: chessarena-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build -w @chessarena/shared && npm run build -w @chessarena/api
    startCommand: npm run start -w @chessarena/api
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
